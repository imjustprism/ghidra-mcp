[package]
name = "ghidra-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast Rust MCP server bridging LLMs to Ghidra via an HTTP plugin"
license = "Apache-2.0"
repository = "https://github.com/imjustprism/ghidra-mcp"
homepage = "https://github.com/imjustprism/ghidra-mcp"
readme = "README.md"
keywords = ["ghidra", "mcp", "reversing", "decompilation", "llm"]
categories = ["development-tools", "command-line-utilities"]
authors = ["imjustprism"]

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_const_for_fn = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
future_not_send = "allow"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
cargo_common_metadata = "allow"
